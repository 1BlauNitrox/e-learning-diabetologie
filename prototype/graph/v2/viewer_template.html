<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Graph v2 prototype: Ketonkörper</title>
<style>
:root{--bg:#fff;--text:#222;--muted:#666;--border:#ccc;--strong:#999;--accent-bg:#e6f1fb;--accent-border:#378add;--accent-text:#0c447c}
@media (prefers-color-scheme: dark){:root{--bg:#1e1e1c;--text:#e8e6df;--muted:#b4b2a9;--border:#555;--strong:#777;--accent-bg:#0c447c;--accent-border:#85b7eb;--accent-text:#e6f1fb}}
body{font-family:system-ui,sans-serif;max-width:1200px;margin:16px auto;padding:0 16px;background:var(--bg);color:var(--text)}
h1{font-size:18px;font-weight:600;margin:0 0 2px}
#about{font-size:13px;color:var(--muted);margin:0 0 10px}
#views{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:4px 0 6px}
#legend{font-size:12px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap;margin:0 0 8px}
#net{height:680px;border:1px solid var(--border);border-radius:12px}
#panel{min-height:96px;margin-top:8px;font-size:13px;line-height:1.5}
#panel b{font-weight:500;color:var(--muted);display:inline-block;min-width:120px}
.vb{font:inherit;font-size:13px;padding:5px 10px;border-radius:8px;border:1px solid var(--strong);background:transparent;color:var(--text);cursor:pointer}
.vb.on{background:var(--accent-bg);border-color:var(--accent-border);color:var(--accent-text)}
.vsep{width:1px;height:20px;background:var(--strong);margin:0 4px}
</style>
</head>
<body>
<h1>Graph v2 prototype: Ketonkörper</h1>
<p id="about">Generated by prototype/graph/v2/build_graph.py; the model is described in docs/graph/v2.md.</p>
<div id="views"></div>
<div id="legend"></div>
<div id="net"></div>
<div id="panel"></div>
<!-- The only external resource. Without a network connection the page shows no graph. -->
<script src="https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
<script>
const DATA = __DATA__;
const HINT = 'Click a node to see its details.';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
// Per kind: background, border, font.
const P = dark
  ? {concept:['#085041','#5DCAA5','#9FE1CB'], statement:['#3C3489','#AFA9EC','#CECBF6'], segment:['#444441','#B4B2A9','#D3D1C7'], mapped:['#0C447C','#85B7EB','#B5D4F4'], edge:'#888780', label:'#B4B2A9'}
  : {concept:['#E1F5EE','#0F6E56','#085041'], statement:['#EEEDFE','#534AB7','#3C3489'], segment:['#F1EFE8','#5F5E5A','#444441'], mapped:['#E6F1FB','#185FA5','#0C447C'], edge:'#888780', label:'#5F5E5A'};
const FACE = getComputedStyle(document.body).fontFamily || 'sans-serif';
// Structure nodes: border width and font size by level.
const LEVEL = {domain: [3, 17], course: [3, 16], section: [2, 14], slide: [2, 13], segment: [1, 11]};
function look(n, view) {
  const key = n.kind === 'statement' || n.kind === 'concept' ? n.kind : (n.mapped && view === 'structure' ? 'mapped' : 'segment');
  const [bg, border, font] = P[key];
  const level = LEVEL[n.kind];
  return {
    shape: n.kind === 'concept' ? 'ellipse' : 'box',
    color: {background: bg, border: border, highlight: {background: bg, border: border}, hover: {background: bg, border: border}},
    borderWidth: level ? level[0] : 1,
    font: {color: font, size: level ? (view === 'structure' ? level[1] : 13) : n.kind === 'statement' ? 12 : 14, face: FACE},
    margin: 8
  };
}
const VIEWS = DATA.slides.map(s => [s, 'Slide ' + s]).concat([null, ['structure', 'Structure layer'], ['content', 'Content layer'], ['compact', 'Content layer, compact']]);
const LEGEND = {
  slide: [['concept','Concept'],['statement','Statement'],['segment','Slide, segment']],
  structure: [['segment','Domain, course, section, slide, segment'],['mapped','Segment with statements']],
  content: [['concept','Concept'],['statement','Statement']],
  compact: [['concept','Concept'],['statement','Statement drawn as an edge (click it for details)']]
};
const bar = document.getElementById('views');
VIEWS.forEach(v => {
  if (!v) { const s = document.createElement('span'); s.className = 'vsep'; bar.appendChild(s); return; }
  const b = document.createElement('button'); b.className = 'vb'; b.dataset.v = v[0]; b.textContent = v[1];
  b.addEventListener('click', () => show(v[0])); bar.appendChild(b);
});
const byId = Object.fromEntries(DATA.nodes.map(n => [n.id, n]));
const panel = document.getElementById('panel');
function details(id) {
  panel.textContent = '';
  byId[id].info.forEach(([k, v]) => {
    const row = document.createElement('div');
    const b = document.createElement('b'); b.textContent = k;
    row.appendChild(b); row.appendChild(document.createTextNode(v));
    panel.appendChild(row);
  });
}
let net;
function show(view) {
  document.querySelectorAll('.vb').forEach(b => b.classList.toggle('on', b.dataset.v === view));
  document.getElementById('legend').innerHTML = (LEGEND[view] || LEGEND.slide)
    .map(([k, t]) => '<span><span style="display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;background:' + P[k][0] + ';border:1px solid ' + P[k][1] + '"></span>' + t + '</span>').join('');
  panel.textContent = 'Laying out the graph …';
  const compact = view === 'compact';
  const nodes = DATA.nodes.filter(n => compact ? n.kind === 'concept' : n.views.includes(view));
  const ids = new Set(nodes.map(n => n.id));
  const source = compact ? DATA.compact : DATA.edges.filter(e => ids.has(e.from) && ids.has(e.to));
  const edges = source.map((e, i) => ({
    id: i, from: e.from, to: e.to, label: view === 'structure' ? undefined : e.label, arrows: 'to',
    dashes: compact ? false : e.kind !== 'role',
    color: compact ? {color: P.statement[1]} : {color: P.edge, highlight: P.edge, hover: P.edge},
    font: {size: 11, color: compact ? P.statement[1] : P.label, strokeWidth: 0, align: 'top', face: FACE},
    smooth: {type: 'dynamic'}
  }));
  // The two content views and the structure view are large; they get a tighter layout and fewer iterations.
  const big = view === 'content' || compact;
  const physics = view === 'structure'
    ? {gravitationalConstant: -2200, centralGravity: 0.6, springLength: 55, springConstant: 0.08, avoidOverlap: 0.5}
    : big ? {gravitationalConstant: compact ? -3000 : -2600, centralGravity: compact ? 1.6 : 1.3, springLength: compact ? 130 : 80, springConstant: 0.05, avoidOverlap: 0.7}
    : {gravitationalConstant: -3500, centralGravity: 0.5, springLength: 95, springConstant: 0.05, avoidOverlap: 0.6};
  if (net) net.destroy();
  net = new vis.Network(document.getElementById('net'),
    {nodes: nodes.map(n => Object.assign({id: n.id, label: view === 'structure' && n.short ? n.short : n.label}, look(n, view))), edges: edges},
    {physics: {barnesHut: physics, stabilization: {iterations: big || view === 'structure' ? 900 : 1500}}, interaction: {hover: true}});
  // The layout is frozen once it has settled, so nodes stay where they are while reading.
  net.once('stabilizationIterationsDone', () => { net.setOptions({physics: false}); net.fit({animation: false}); panel.textContent = HINT; });
  net.on('click', p => {
    if (p.nodes.length) details(p.nodes[0]);
    else if (compact && p.edges.length) details(DATA.compact[p.edges[0]].statement);
    else panel.textContent = HINT;
  });
}
show('compact');
</script>
</body>
</html>
